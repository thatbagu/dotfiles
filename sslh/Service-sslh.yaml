apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/allow-shared-ip: sslh-svc
  name: sslh
  namespace: cv
spec:
  externalTrafficPolicy: Cluster
  loadBalancerIP: 192.168.1.195
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
  selector:
    app: sslh
  type: LoadBalancer
