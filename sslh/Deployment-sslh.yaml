apiVersion: apps/v1
kind: Deployment
metadata:
  name: sslh
  namespace: cv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sslh
  template:
    metadata:
      labels:
        app: sslh
    spec:
      containers:
        - args:
            - --foreground
            - --listen=0.0.0.0:443
            - --ssh=cv-tui.cv.svc.cluster.local:2222
            - --tls=haproxy.nginx-system.svc.cluster.local:443
            - --on-timeout=ssh
          image: ghcr.io/yrutschle/sslh@sha256:9428d9890980ad328f64c67c18a99fd7be3234db3cc5a5c505b1db99e4b31831
          name: sslh
          ports:
            - containerPort: 443
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
