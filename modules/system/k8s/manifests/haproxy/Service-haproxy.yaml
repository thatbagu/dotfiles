apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: nginx-system
spec:
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.1.193
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
    - name: ssh-tui
      port: 22
      protocol: TCP
      targetPort: 22
  selector:
    app: haproxy
  type: LoadBalancer
