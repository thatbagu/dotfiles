apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app: pihole
    chart: pihole-2.35.0
    component: ""
    heritage: Helm
    release: pihole
  name: pihole
  namespace: pihole-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
