apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: pihole
    chart: pihole-2.35.0
    heritage: Helm
    release: pihole
  name: pihole
  namespace: pihole-system
spec:
  rules:
    - host: pihole.home
      http:
        paths:
          - backend:
              service:
                name: pihole-web
                port:
                  name: http
            path: /
            pathType: ImplementationSpecific
    - host: pihole.test
      http:
        paths:
          - backend:
              service:
                name: pihole-web
                port:
                  name: http
            path: /
            pathType: ImplementationSpecific
