apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/allow-shared-ip: wireguard-svc
  name: wireguard
  namespace: wireguard-system
spec:
  loadBalancerIP: 192.168.1.194
  ports:
    - name: wireguard
      port: 51820
      protocol: UDP
      targetPort: 51820
  selector:
    app: wireguard
  type: LoadBalancer
