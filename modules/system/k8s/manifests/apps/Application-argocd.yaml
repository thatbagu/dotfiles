apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./modules/system/k8s/manifests/argocd
    repoURL: https://github.com/thatbagu/dotfiles.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
