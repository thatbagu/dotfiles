apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: nextcloud
  namespace: argocd
spec:
  destination:
    namespace: nextcloud
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./modules/system/k8s/manifests/nextcloud
    repoURL: https://github.com/thatbagu/dotfiles.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
