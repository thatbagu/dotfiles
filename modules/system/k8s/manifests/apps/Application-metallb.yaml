apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: metallb
  namespace: argocd
spec:
  destination:
    namespace: metallb-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./modules/system/k8s/manifests/metallb
    repoURL: https://github.com/Jahysama/dotfiles.git
    targetRevision: main
  syncPolicy: {}
