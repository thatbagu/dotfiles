apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: pihole-external-ingress
  namespace: argocd
spec:
  destination:
    namespace: pihole-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./modules/system/k8s/manifests/pihole-external-ingress
    repoURL: https://github.com/Jahysama/dotfiles.git
    targetRevision: main
  syncPolicy: {}
