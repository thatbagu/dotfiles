apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: cert-manager-issuers
  namespace: argocd
spec:
  destination:
    namespace: dns-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./modules/system/k8s/manifests/cert-manager-issuers
    repoURL: https://github.com/thatbagu/dotfiles.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
