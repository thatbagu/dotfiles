apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: haproxy
  namespace: argocd
spec:
  destination:
    namespace: nginx-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./modules/system/k8s/manifests/haproxy
    repoURL: https://github.com/thatbagu/dotfiles.git
    targetRevision: main
  syncPolicy: {}
