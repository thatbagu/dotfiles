apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
  namespace: cv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv
  template:
    metadata:
      labels:
        app: cv
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - worker
              weight: 100
      containers:
        - image: docker.io/thatbagu/website:latest
          imagePullPolicy: Always
          name: cv
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
