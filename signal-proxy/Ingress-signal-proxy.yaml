apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  name: signal-proxy
  namespace: proxies
spec:
  ingressClassName: nginx
  rules:
    - host: signal.egor.house
      http:
        paths:
          - backend:
              service:
                name: signal-proxy
                port:
                  number: 443
            path: /
            pathType: Prefix
