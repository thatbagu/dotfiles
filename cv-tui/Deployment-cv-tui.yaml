apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-tui
  namespace: cv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cv-tui
  template:
    metadata:
      labels:
        app: cv-tui
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - worker
              weight: 100
      containers:
        - image: docker.io/thatbagu/cv-tui:latest
          imagePullPolicy: Always
          name: cv-tui
          ports:
            - containerPort: 2222
              name: ssh
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app/.ssh/cv_ssh_host_key
              name: ssh-host-key
              readOnly: true
              subPath: cv_ssh_host_key
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: ssh-host-key
          secret:
            defaultMode: 288
            secretName: cv-tui-ssh-host-key
        - emptyDir:
            sizeLimit: 16Mi
          name: tmp
