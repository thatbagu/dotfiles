apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-proxy
  namespace: telegram-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-proxy
  template:
    metadata:
      labels:
        app: telegram-proxy
    spec:
      containers:
        - args:
            - simple-run
            - 0.0.0.0:443
            - ee$(MTP_SECRET)7777772e676f6f676c652e636f6d
          command:
            - /mtg
          env:
            - name: MTP_SECRET
              valueFrom:
                secretKeyRef:
                  key: secret
                  name: telegram-proxy-secrets
          image: ghcr.io/9seconds/mtg:2@sha256:9553495b5216cbe6b238e88ce8a3d43ef582e4dc45fcdd7a14d54497500f5d4f
          name: telegram-proxy
          ports:
            - containerPort: 443
              name: mtproto
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
