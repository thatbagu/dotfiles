apiVersion: v1
data:
  02-custom.conf: |
    addn-hosts=/etc/addn-hosts
    address=/pihole.home/192.168.1.250
    address=/nextcloud.egor.house/10.0.100.1
    dhcp-option=6,192.168.1.250
  05-pihole-custom-cname.conf: ""
  addn-hosts: |
    192.168.1.250 pihole.home
    192.168.1.250 pihole.test
    192.168.1.250 pihole.egor.house
kind: ConfigMap
metadata:
  labels:
    app: pihole
    chart: pihole-2.35.0
    heritage: Helm
    release: pihole
  name: pihole-custom-dnsmasq
  namespace: pihole-system
