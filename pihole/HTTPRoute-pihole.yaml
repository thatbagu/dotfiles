apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: pihole-system
spec:
  hostnames:
    - pihole.home
    - pihole.test
  parentRefs:
    - name: nixlab
      namespace: gateway-system
      sectionName: http
  rules:
    - backendRefs:
        - name: pihole-web
          port: 80
