apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: monitoring
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: apps
      jsonPointers:
        - /spec/volumeClaimTemplates
      kind: StatefulSet
  project: default
  source:
    path: ./monitoring
    repoURL: https://github.com/thatbagu/dotfiles.git
    targetRevision: k8s-rendered
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
