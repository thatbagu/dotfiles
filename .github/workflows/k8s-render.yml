# Render the homelab Kubernetes manifests (nixidy env .#homelab) and commit
# them to the `k8s-rendered` branch, which Argo CD syncs the cluster from.
name: Render k8s manifests

on:
  push:
    branches: [main]
    paths:
      - "homelab/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

# Renders must land in push order.
concurrency:
  group: k8s-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Helm charts from the public binary cache, not from GitHub release
      # pages (which time out for hours at a time).
      - uses: cachix/cachix-action@v16
        with:
          name: thatbagu0nixlab
          skipPush: true

      # Helm charts download from GitHub release pages, which time out now
      # and then (504): retry only for that.
      - name: Build nixidy environment
        id: build
        run: |
          for attempt in 1 2 3; do
            set +e
            nix build --no-link --print-out-paths --print-build-logs .#nixidyEnvs.x86_64-linux.homelab.environmentPackage > out.txt 2> build.log
            status=$?
            set -e
            cat build.log
            if [ "$status" = 0 ]; then echo "out-path=$(tail -1 out.txt)" >> "$GITHUB_OUTPUT"; exit 0; fi
            grep -qE 'failed to fetch https://github\.com/[^ ]+ : 5[0-9][0-9]' build.log || exit "$status"
            echo "::warning::A GitHub release download failed; retrying (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      # Cache new chart downloads (only those), e.g. after a chart update.
      - name: Push chart downloads to the binary cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          [ -n "$CACHIX_AUTH_TOKEN" ] || { echo "No CACHIX_AUTH_TOKEN; not pushing."; exit 0; }
          shopt -s nullglob
          charts=()
          for p in /nix/store/*-helm-chart-*; do
            [[ "$(basename "$p")" =~ ^[a-z0-9]{32}-helm-chart- && "$p" != *.drv ]] && charts+=("$p")
          done
          [ ${#charts[@]} = 0 ] || cachix push thatbagu0nixlab "${charts[@]}"

      - uses: actions/checkout@v4
        with:
          ref: k8s-rendered
          path: rendered

      - name: Commit rendered manifests
        working-directory: rendered
        env:
          OUT: ${{ steps.build.outputs.out-path }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
          cp -rL --no-preserve=mode "$OUT"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Rendered manifests unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898273+github-actions[bot]@users.noreply.github.com" \
              commit -m "render: main@${GITHUB_SHA::7}"
          git push
