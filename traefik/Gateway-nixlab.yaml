apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: nixlab
  namespace: gateway-system
spec:
  gatewayClassName: traefik
  listeners:
    - allowedRoutes:
        namespaces:
          from: All
      name: http
      port: 8000
      protocol: HTTP
    - allowedRoutes:
        namespaces:
          from: All
      hostname: mlship.dev
      name: https-mlship-dev
      port: 8443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: https-mlship-dev
        mode: Terminate
    - allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TLSRoute
        namespaces:
          from: All
      hostname: signal.egor.house
      name: tls-signal-egor-house
      port: 8443
      protocol: TLS
      tls:
        mode: Passthrough
