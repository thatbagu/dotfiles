apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: wireguard-data
  namespace: wireguard-system
spec:
  restic:
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
    copyMethod: Clone
    pruneIntervalDays: 7
    repository: volsync-wireguard-data
    retain:
      daily: 7
      monthly: 6
      weekly: 4
      within: 7d
    storageClassName: longhorn
  sourcePVC: wireguard-data
  trigger:
    schedule: 15 2 * * *
