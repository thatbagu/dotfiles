apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: pihole
  namespace: pihole-system
spec:
  restic:
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
    copyMethod: Clone
    pruneIntervalDays: 7
    repository: volsync-pihole
    retain:
      daily: 7
      monthly: 6
      weekly: 4
    storageClassName: longhorn
  sourcePVC: pihole
  trigger:
    schedule: 15 2 * * *
