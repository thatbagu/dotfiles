apiVersion: v1
data:
  alertmanager.yml: |
    global: {}
    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = warning
      target_matchers:
      - severity = info
    - equal:
      - namespace
      source_matchers:
      - alertname = InfoInhibitor
      target_matchers:
      - severity = info
    receivers:
    - name: "null"
    - name: notify
      webhook_configs:
      - url_file: /etc/alertmanager/secrets/alertmanager-notifications/ntfy-url
    route:
      group_by:
      - alertname
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: notify
      repeat_interval: 12h
      routes:
      - group_interval: 1m
        group_wait: 0s
        matchers:
        - alertname = Watchdog
        receiver: "null"
        repeat_interval: 1m
      - matchers:
        - alertname = InfoInhibitor
        receiver: "null"
    templates:
    - /etc/alertmanager/*.tmpl
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/version: v0.32.1
    helm.sh/chart: alertmanager-1.36.0
  name: prometheus-alertmanager
  namespace: monitoring
