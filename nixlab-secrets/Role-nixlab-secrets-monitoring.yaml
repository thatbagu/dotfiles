apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-monitoring
  namespace: monitoring
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - grafana-admin
      - alertmanager-notifications
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
