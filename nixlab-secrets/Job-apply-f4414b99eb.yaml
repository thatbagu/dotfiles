apiVersion: batch/v1
kind: Job
metadata:
  name: apply-f4414b99eb
  namespace: nixlab-secrets
spec:
  backoffLimit: 10
  template:
    spec:
      containers:
        - args:
            - apply
            - --server-side
            - --field-manager=nixlab-secrets
            - --force-conflicts
            - -f
            - /decrypted/secrets.yaml
          image: registry.k8s.io/kubectl:v1.35.10@sha256:4e1d541a3d62f74637974e4c71f3cea91b9a36ffd059ab45e355648898783837
          name: apply
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /decrypted
              name: decrypted
              readOnly: true
      initContainers:
        - command:
            - /bin/sh
            - /script/prepare.sh
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /age/keys.txt
          image: ghcr.io/getsops/sops:v3.13.3-alpine@sha256:ae501277bf742f1662e0f881f43dd8fd6798b489a8058e921dbf6cda597140ea
          name: decrypt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /age
              name: age
              readOnly: true
            - mountPath: /encrypted
              name: encrypted
              readOnly: true
            - mountPath: /script
              name: script
              readOnly: true
            - mountPath: /decrypted
              name: decrypted
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nixlab-secrets
      volumes:
        - name: age
          secret:
            defaultMode: 288
            secretName: age-key
        - configMap:
            name: encrypted-f4414b99eb
          name: encrypted
        - configMap:
            name: script-f4414b99eb
          name: script
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: decrypted
