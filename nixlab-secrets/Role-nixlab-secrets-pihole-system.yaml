apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-pihole-system
  namespace: pihole-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - pihole-admin
      - volsync-pihole
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
