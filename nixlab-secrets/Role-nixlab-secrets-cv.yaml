apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-cv
  namespace: cv
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - cv-tui-ssh-host-key
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
