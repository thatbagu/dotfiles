apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-nextcloud
  namespace: nextcloud
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - nextcloud-admin
      - nextcloud-db
      - nextcloud-redis
      - nextcloud-oidc
      - volsync-nextcloud-nextcloud
      - volsync-nextcloud-db-dumps
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
