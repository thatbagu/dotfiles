apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-telegram-proxy
  namespace: telegram-proxy
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - telegram-proxy-secrets
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
