apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nixlab-secrets
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - cv
      - arc-runners
    resources:
      - namespaces
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - cv-tui-ssh-host-key
      - arc-github
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
