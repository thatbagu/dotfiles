apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-longhorn-system
  namespace: longhorn-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - backup-s3
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
