apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-arc-runners
  namespace: arc-runners
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - arc-github
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
