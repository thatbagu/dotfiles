apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-wireguard-system
  namespace: wireguard-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - wireguard-secrets
      - volsync-wireguard-data
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
