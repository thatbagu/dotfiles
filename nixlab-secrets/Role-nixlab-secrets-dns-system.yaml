apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nixlab-secrets-dns-system
  namespace: dns-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - externaldns-pihole
      - cloudflare-api-token
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
