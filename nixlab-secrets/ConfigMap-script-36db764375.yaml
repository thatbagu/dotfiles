apiVersion: v1
data:
  prepare.sh: "set -euo pipefail\nout=/decrypted/secrets.yaml\n: > \"$out\"\n# Namespaces another app owns may not exist yet on a fresh cluster (that\n# app syncs later): create them bare, the app adopts them when it syncs.\nprintf -- '---\\napiVersion: v1\\nkind: Namespace\\nmetadata:\\n  name: %s\\n' cv >> \"$out\"\nprintf -- '---\\napiVersion: v1\\nkind: Namespace\\nmetadata:\\n  name: %s\\n' arc-runners >> \"$out\"\n\n# Fails (and the Job with it) rather than writing an empty value.\nvalue() {\n  v=$(sops -d --extract \"[\\\"$1\\\"]\" /encrypted/secrets.yaml | base64 | tr -d '\\n')\n  [ -n \"$v\" ] || { echo \"$1: missing or empty in secrets.yaml\" >&2; return 1; }\n  printf %s \"$v\"\n}\nv1=$(value github_token)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: arc-github'\n  echo '  namespace: arc-runners'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  github_token: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared arc-runners/arc-github\"\nv1=$(value cv_tui_ssh_host_key)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: cv-tui-ssh-host-key'\n  echo '  namespace: cv'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  cv_ssh_host_key: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared cv/cv-tui-ssh-host-key\"\nv1=$(value cloudflare_token)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: cloudflare-api-token'\n  echo '  namespace: dns-system'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  api-token: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared dns-system/cloudflare-api-token\"\nv1=$(value pihole_password)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: externaldns-pihole'\n  echo '  namespace: dns-system'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  password: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared dns-system/externaldns-pihole\"\nv1=$(value backup_s3_access_key_id)\nv2=$(value backup_s3_secret_access_key)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: backup-s3'\n  echo '  namespace: longhorn-system'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  AWS_ACCESS_KEY_ID: $v1\"\necho \"  AWS_SECRET_ACCESS_KEY: $v2\"\n\n  echo 'stringData:'\n  echo '  AWS_ENDPOINTS: \"https://ac82cafee9c2ed14c3bd48416f96d262.r2.cloudflarestorage.com\"'\n\n} >> \"$out\"\necho \"prepared longhorn-system/backup-s3\"\nv1=$(value monitoring_ntfy_url)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: alertmanager-notifications'\n  echo '  namespace: monitoring'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  ntfy-url: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared monitoring/alertmanager-notifications\"\nv1=$(value grafana_admin_password)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: grafana-admin'\n  echo '  namespace: monitoring'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  admin-password: $v1\"\n\n  echo 'stringData:'\n  echo '  admin-user: \"admin\"'\n\n} >> \"$out\"\necho \"prepared monitoring/grafana-admin\"\nv1=$(value nextcloud_admin_password)\nv2=$(value nextcloud_admin_username)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: nextcloud-admin'\n  echo '  namespace: nextcloud'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  password: $v1\"\necho \"  nextcloud-username: $v2\"\n\n  \n  \n} >> \"$out\"\necho \"prepared nextcloud/nextcloud-admin\"\nv1=$(value nextcloud_db_password)\nv2=$(value nextcloud_db_username)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: nextcloud-db'\n  echo '  namespace: nextcloud'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  password: $v1\"\necho \"  db-username: $v2\"\n\n  \n  \n} >> \"$out\"\necho \"prepared nextcloud/nextcloud-db\"\nv1=$(value nextcloud_redis_password)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: nextcloud-redis'\n  echo '  namespace: nextcloud'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  password: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared nextcloud/nextcloud-redis\"\nv1=$(value nextcloud_sso_secret)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: nextcloud-sso'\n  echo '  namespace: nextcloud'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  secret: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared nextcloud/nextcloud-sso\"\nv1=$(value backup_restic_password)\nv2=$(value backup_s3_access_key_id)\nv3=$(value backup_s3_secret_access_key)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: volsync-nextcloud-db-dumps'\n  echo '  namespace: nextcloud'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  RESTIC_PASSWORD: $v1\"\necho \"  AWS_ACCESS_KEY_ID: $v2\"\necho \"  AWS_SECRET_ACCESS_KEY: $v3\"\n\n  echo 'stringData:'\n  echo '  RESTIC_REPOSITORY: \"s3:https://ac82cafee9c2ed14c3bd48416f96d262.r2.cloudflarestorage.com/homelab-backup/longhorn/volsync/nextcloud-nextcloud-db-dumps\"'\necho '  AWS_DEFAULT_REGION: \"auto\"'\n\n} >> \"$out\"\necho \"prepared nextcloud/volsync-nextcloud-db-dumps\"\nv1=$(value backup_restic_password)\nv2=$(value backup_s3_access_key_id)\nv3=$(value backup_s3_secret_access_key)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: volsync-nextcloud-nextcloud'\n  echo '  namespace: nextcloud'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  RESTIC_PASSWORD: $v1\"\necho \"  AWS_ACCESS_KEY_ID: $v2\"\necho \"  AWS_SECRET_ACCESS_KEY: $v3\"\n\n  echo 'stringData:'\n  echo '  RESTIC_REPOSITORY: \"s3:https://ac82cafee9c2ed14c3bd48416f96d262.r2.cloudflarestorage.com/homelab-backup/longhorn/volsync/nextcloud-nextcloud-nextcloud\"'\necho '  AWS_DEFAULT_REGION: \"auto\"'\n\n} >> \"$out\"\necho \"prepared nextcloud/volsync-nextcloud-nextcloud\"\nv1=$(value pihole_password)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: pihole-admin'\n  echo '  namespace: pihole-system'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  password: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared pihole-system/pihole-admin\"\nv1=$(value backup_restic_password)\nv2=$(value backup_s3_access_key_id)\nv3=$(value backup_s3_secret_access_key)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: volsync-pihole'\n  echo '  namespace: pihole-system'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  RESTIC_PASSWORD: $v1\"\necho \"  AWS_ACCESS_KEY_ID: $v2\"\necho \"  AWS_SECRET_ACCESS_KEY: $v3\"\n\n  echo 'stringData:'\n  echo '  RESTIC_REPOSITORY: \"s3:https://ac82cafee9c2ed14c3bd48416f96d262.r2.cloudflarestorage.com/homelab-backup/longhorn/volsync/pihole-system-pihole\"'\necho '  AWS_DEFAULT_REGION: \"auto\"'\n\n} >> \"$out\"\necho \"prepared pihole-system/volsync-pihole\"\nv1=$(value telegram_proxy_secret)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: telegram-proxy-secrets'\n  echo '  namespace: telegram-proxy'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  secret: $v1\"\n\n  \n  \n} >> \"$out\"\necho \"prepared telegram-proxy/telegram-proxy-secrets\"\nv1=$(value backup_restic_password)\nv2=$(value backup_s3_access_key_id)\nv3=$(value backup_s3_secret_access_key)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: volsync-wireguard-data'\n  echo '  namespace: wireguard-system'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  RESTIC_PASSWORD: $v1\"\necho \"  AWS_ACCESS_KEY_ID: $v2\"\necho \"  AWS_SECRET_ACCESS_KEY: $v3\"\n\n  echo 'stringData:'\n  echo '  RESTIC_REPOSITORY: \"s3:https://ac82cafee9c2ed14c3bd48416f96d262.r2.cloudflarestorage.com/homelab-backup/longhorn/volsync/wireguard-system-wireguard-data\"'\necho '  AWS_DEFAULT_REGION: \"auto\"'\n\n} >> \"$out\"\necho \"prepared wireguard-system/volsync-wireguard-data\"\nv1=$(value wireguard_server_public_key)\nv2=$(value wireguard_server_endpoint)\nv3=$(value wireguard_server_private_key)\nv4=$(value nextcloud_sso_secret)\nv5=$(value anya_laptop_wg_public_key)\nv6=$(value anya_phone_wg_public_key)\nv7=$(value egor_main_wg_public_key)\nv8=$(value dsh_wg_public_key)\n\n{\n  echo '---'\n  echo 'apiVersion: v1'\n  echo 'kind: Secret'\n  echo 'metadata:'\n  echo '  name: wireguard-secrets'\n  echo '  namespace: wireguard-system'\n  echo '  labels: { app.kubernetes.io/managed-by: nixlab-secrets }'\n  echo '  annotations: { kubectl.kubernetes.io/last-applied-configuration: \"\" }'\n  echo 'type: Opaque'\n  echo 'data:'\n  echo \"  server-public-key: $v1\"\necho \"  wg-server-endpoint: $v2\"\necho \"  server-private-key: $v3\"\necho \"  nextcloud-sso-secret: $v4\"\necho \"  anya_laptop_wg_public_key: $v5\"\necho \"  anya_phone_wg_public_key: $v6\"\necho \"  egor_main_wg_public_key: $v7\"\necho \"  dsh_wg_public_key: $v8\"\n\n  \n  \n} >> \"$out\"\necho \"prepared wireguard-system/wireguard-secrets\"\n"
kind: ConfigMap
metadata:
  name: script-36db764375
  namespace: nixlab-secrets
