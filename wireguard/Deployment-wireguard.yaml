apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: c7744e22abdf79d5002b4d0b42a0dc347450c66923ef9566d211906943740309
      labels:
        app: wireguard
    spec:
      containers:
        - env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: UTC
            - name: SERVERURL
              value: auto
            - name: SERVERPORT
              value: "51820"
            - name: PEERDNS
              value: 192.168.1.250
            - name: INTERNAL_SUBNET
              value: 10.0.100.0
            - name: ALLOWEDIPS
              value: 0.0.0.0/0
            - name: LOG_CONFS
              value: "true"
          image: lscr.io/linuxserver/wireguard@sha256:b677c3f46d524921c8a7c91873479eb7bab190d098fddbbd887ce333ec078c90
          imagePullPolicy: IfNotPresent
          name: wireguard
          ports:
            - containerPort: 51820
              name: wireguard
              protocol: UDP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
            privileged: true
          volumeMounts:
            - mountPath: /config
              name: wireguard-data
            - mountPath: /lib/modules
              name: lib-modules
              readOnly: true
        - args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          env:
            - name: NEXTCLOUD_SSO_SECRET
              valueFrom:
                secretKeyRef:
                  key: nextcloud-sso-secret
                  name: wireguard-secrets
          image: docker.io/library/caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
          name: caddy
          ports:
            - containerPort: 443
              name: https
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/caddy
              name: caddy-config
            - mountPath: /certs
              name: nextcloud-tls
              readOnly: true
            - mountPath: /data
              name: caddy-data
      initContainers:
        - args:
            - |
              # Fail the pod on any error: a half-written config looks like a
              # working VPN that never comes up.
              set -e

              # Copy template to the config directory (a fresh volume doesn't
              # have wg_confs yet).
              mkdir -p /config/wg_confs
              cp /config-template/wg0.conf.template /config/wg_confs/wg0.conf

              # Replace server private key
              sed -i "s|__SERVER_PRIVATE_KEY__|$(cat /secrets/server-private-key)|g" /config/wg_confs/wg0.conf

              # Replace user public keys from SOPS secrets
              sed -i "s|__ANYA-LAPTOP_PUBLIC_KEY__|$(cat /secrets/anya_laptop_wg_public_key)|g" /config/wg_confs/wg0.conf

              sed -i "s|__ANYA-PHONE_PUBLIC_KEY__|$(cat /secrets/anya_phone_wg_public_key)|g" /config/wg_confs/wg0.conf

              sed -i "s|__EGOR-MAIN_PUBLIC_KEY__|$(cat /secrets/egor_main_wg_public_key)|g" /config/wg_confs/wg0.conf

              sed -i "s|__FRIEND-TEST_PUBLIC_KEY__|$(cat /secrets/dsh_wg_public_key)|g" /config/wg_confs/wg0.conf


              # For client configs, replace server public key and endpoint
              SERVER_PUBLIC_KEY=$(cat /secrets/server-public-key)
              WG_ENDPOINT=$(cat /secrets/wg-server-endpoint)

              # Replace placeholders in all client config files
              for file in /config-template/*; do
                if [[ $file != *.template ]]; then
                  filename=$(basename "$file")
                  cp "$file" "/config/$filename"
                  sed -i "s|__SERVER_PUBLIC_KEY__|$SERVER_PUBLIC_KEY|g" "/config/$filename"
                  sed -i "s|__WG_SERVER_ENDPOINT__|$WG_ENDPOINT|g" "/config/$filename"
                fi
              done

              # Set proper permissions
              chmod 600 /config/wg_confs/wg0.conf

              echo "WireGuard config ready with 4 users"
          command:
            - /bin/sh
            - -c
          image: docker.io/library/alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
          name: setup-config
          volumeMounts:
            - mountPath: /config-template
              name: config-template
            - mountPath: /config
              name: wireguard-data
            - mountPath: /secrets
              name: wireguard-secrets
      volumes:
        - name: wireguard-data
          persistentVolumeClaim:
            claimName: wireguard-data
        - configMap:
            name: wireguard-config
          name: config-template
        - name: wireguard-secrets
          secret:
            secretName: wireguard-secrets
        - hostPath:
            path: /lib/modules
            type: DirectoryOrCreate
          name: lib-modules
        - configMap:
            items:
              - key: Caddyfile
                path: Caddyfile
            name: wireguard-config
          name: caddy-config
        - name: nextcloud-tls
          secret:
            secretName: nextcloud-tls
        - emptyDir: {}
          name: caddy-data
