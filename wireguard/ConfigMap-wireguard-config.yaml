apiVersion: v1
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :443 {
      tls /certs/tls.crt /certs/tls.key
      header Strict-Transport-Security "max-age=15552000"
      # Identity headers never come from a client, only from below.
      request_header -X-Remote-User

    @auth_anya_laptop {
      host auth.egor.house
      remote_ip 10.0.100.12
    }
    handle @auth_anya_laptop {
      reverse_proxy 127.0.0.1:5556 {
        header_up X-Remote-User "anya"
      }
    }

    @auth_anya_phone {
      host auth.egor.house
      remote_ip 10.0.100.11
    }
    handle @auth_anya_phone {
      reverse_proxy 127.0.0.1:5556 {
        header_up X-Remote-User "anya"
      }
    }

    @auth_egor_main {
      host auth.egor.house
      remote_ip 10.0.100.2
    }
    handle @auth_egor_main {
      reverse_proxy 127.0.0.1:5556 {
        header_up X-Remote-User "egor"
      }
    }

    @auth_friend_test {
      host auth.egor.house
      remote_ip 10.0.100.20
    }
    handle @auth_friend_test {
      reverse_proxy 127.0.0.1:5556 {
        header_up X-Remote-User "friend-test"
      }
    }

      # Anyone else (apps exchanging codes, unknown peers): no identity.
      @auth host auth.egor.house
      handle @auth {
        reverse_proxy 127.0.0.1:5556
      }
    @nextcloud host nextcloud.egor.house
    handle @nextcloud {
      reverse_proxy http://nextcloud.nextcloud.svc.cluster.local:8080 {
        header_up Host nextcloud.egor.house
        header_up X-Real-IP {remote_host}
      }
    }

      handle {
        respond "Not found" 404
      }
    }
  anya-laptop: |
    [Interface]
    PrivateKey = __PASTE_ANYA-LAPTOP_PRIVATE_KEY_HERE__
    Address = 10.0.100.12/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 10.0.100.0/24, 192.168.1.250/32
    PersistentKeepalive = 25
  anya-phone: |
    [Interface]
    PrivateKey = __PASTE_ANYA-PHONE_PRIVATE_KEY_HERE__
    Address = 10.0.100.11/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 10.0.100.0/24, 192.168.1.250/32
    PersistentKeepalive = 25
  dex.yaml: '{"connectors":[{"config":{"userHeader":"X-Remote-User"},"id":"vpn","name":"VPN","type":"authproxy"}],"enablePasswordDB":false,"issuer":"https://auth.egor.house","oauth2":{"responseTypes":["code"],"skipApprovalScreen":true},"staticClients":[{"id":"nextcloud","name":"Nextcloud","redirectURIs":["https://nextcloud.egor.house/apps/user_oidc/code"],"secretEnv":"NEXTCLOUD_OIDC_SECRET"}],"storage":{"type":"memory"},"web":{"http":"127.0.0.1:5556"}}'
  egor-main: |
    [Interface]
    PrivateKey = __PASTE_EGOR-MAIN_PRIVATE_KEY_HERE__
    Address = 10.0.100.2/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 0.0.0.0/0
    PersistentKeepalive = 25
  friend-test: |
    [Interface]
    PrivateKey = __PASTE_FRIEND-TEST_PRIVATE_KEY_HERE__
    Address = 10.0.100.20/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 192.168.1.100/28
    PersistentKeepalive = 25
  wg0.conf.template: "[Interface]\nAddress = 10.0.100.1/24\nListenPort = 51820\nPrivateKey = __SERVER_PRIVATE_KEY__\n\n# Fixed PostUp/PostDown rules for container networking\nPostUp = echo 1 > /proc/sys/net/ipv4/ip_forward\nPostUp = iptables -A FORWARD -i wg0 -j ACCEPT\nPostUp = iptables -A FORWARD -o wg0 -j ACCEPT  \nPostUp = iptables -t nat -A POSTROUTING -s 10.0.100.0/24 ! -d 10.0.100.0/24 -j MASQUERADE\nPostUp = iptables -A INPUT -p udp --dport 51820 -j ACCEPT\n\n# Per-peer restrictions (see peerFirewall)\nPostUp = iptables -N WG-PEERS\nPostUp = iptables -I FORWARD 1 -i wg0 -j WG-PEERS\nPostUp = iptables -A WG-PEERS -s 10.0.100.12 -d 192.168.1.250 -p udp --dport 53 -j RETURN\nPostUp = iptables -A WG-PEERS -s 10.0.100.12 -d 192.168.1.250 -p tcp --dport 53 -j RETURN\nPostUp = iptables -A WG-PEERS -s 10.0.100.12 -j DROP\nPostUp = iptables -A WG-PEERS -s 10.0.100.11 -d 192.168.1.250 -p udp --dport 53 -j RETURN\nPostUp = iptables -A WG-PEERS -s 10.0.100.11 -d 192.168.1.250 -p tcp --dport 53 -j RETURN\nPostUp = iptables -A WG-PEERS -s 10.0.100.11 -j DROP\nPostUp = iptables -A WG-PEERS -s 10.0.100.20 -d 192.168.1.250 -p udp --dport 53 -j RETURN\nPostUp = iptables -A WG-PEERS -s 10.0.100.20 -d 192.168.1.250 -p tcp --dport 53 -j RETURN\nPostUp = iptables -A WG-PEERS -s 10.0.100.20 -d 192.168.1.100/28 -j RETURN\nPostUp = iptables -A WG-PEERS -s 10.0.100.20 -j DROP\n\nPostDown = iptables -D FORWARD -i wg0 -j ACCEPT\nPostDown = iptables -D FORWARD -o wg0 -j ACCEPT\nPostDown = iptables -t nat -D POSTROUTING -s 10.0.100.0/24 ! -d 10.0.100.0/24 -j MASQUERADE\nPostDown = iptables -D INPUT -p udp --dport 51820 -j ACCEPT\nPostDown = iptables -D FORWARD -i wg0 -j WG-PEERS\nPostDown = iptables -F WG-PEERS\nPostDown = iptables -X WG-PEERS\n\n[Peer]\nPublicKey = __ANYA-LAPTOP_PUBLIC_KEY__\nAllowedIPs = 10.0.100.12/32\n\n\n[Peer]\nPublicKey = __ANYA-PHONE_PUBLIC_KEY__\nAllowedIPs = 10.0.100.11/32\n\n\n[Peer]\nPublicKey = __EGOR-MAIN_PUBLIC_KEY__\nAllowedIPs = 10.0.100.2/32\n\n\n[Peer]\nPublicKey = __FRIEND-TEST_PUBLIC_KEY__\nAllowedIPs = 10.0.100.20/32\n\n"
kind: ConfigMap
metadata:
  name: wireguard-config
  namespace: wireguard-system
