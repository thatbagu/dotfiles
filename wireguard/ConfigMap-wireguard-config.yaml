apiVersion: v1
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :443 {
      tls /certs/tls.crt /certs/tls.key

    @anya_laptop remote_ip 10.0.100.12
    handle @anya_laptop {
      reverse_proxy http://nextcloud.nextcloud.svc.cluster.local:8080 {
        header_up Host nextcloud.egor.house
        header_up X-Remote-User "anya"
        header_up X-Remote-Auth "{$NEXTCLOUD_SSO_SECRET}"
      }
    }


    @anya_phone remote_ip 10.0.100.11
    handle @anya_phone {
      reverse_proxy http://nextcloud.nextcloud.svc.cluster.local:8080 {
        header_up Host nextcloud.egor.house
        header_up X-Remote-User "anya"
        header_up X-Remote-Auth "{$NEXTCLOUD_SSO_SECRET}"
      }
    }


    @egor_main remote_ip 10.0.100.2
    handle @egor_main {
      reverse_proxy http://nextcloud.nextcloud.svc.cluster.local:8080 {
        header_up Host nextcloud.egor.house
        header_up X-Remote-User "egor"
        header_up X-Remote-Auth "{$NEXTCLOUD_SSO_SECRET}"
      }
    }


      handle {
        respond "VPN user not recognized" 403
      }
    }
  anya-laptop: |
    [Interface]
    PrivateKey = __PASTE_ANYA-LAPTOP_PRIVATE_KEY_HERE__
    Address = 10.0.100.12/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 10.0.100.0/24, 192.168.1.250/32
    PersistentKeepalive = 25
  anya-phone: |
    [Interface]
    PrivateKey = __PASTE_ANYA-PHONE_PRIVATE_KEY_HERE__
    Address = 10.0.100.11/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 10.0.100.0/24, 192.168.1.250/32
    PersistentKeepalive = 25
  egor-main: |
    [Interface]
    PrivateKey = __PASTE_EGOR-MAIN_PRIVATE_KEY_HERE__
    Address = 10.0.100.2/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 0.0.0.0/0
    PersistentKeepalive = 25
  friend-test: |
    [Interface]
    PrivateKey = __PASTE_FRIEND-TEST_PRIVATE_KEY_HERE__
    Address = 10.0.100.20/32
    DNS = 192.168.1.250

    [Peer]
    PublicKey = __SERVER_PUBLIC_KEY__
    Endpoint = __WG_SERVER_ENDPOINT__:51820
    AllowedIPs = 192.168.1.100/28
    PersistentKeepalive = 25
  wg0.conf.template: "[Interface]\nAddress = 10.0.100.1/24\nListenPort = 51820\nPrivateKey = __SERVER_PRIVATE_KEY__\n\n# Fixed PostUp/PostDown rules for container networking\nPostUp = echo 1 > /proc/sys/net/ipv4/ip_forward\nPostUp = iptables -A FORWARD -i wg0 -j ACCEPT\nPostUp = iptables -A FORWARD -o wg0 -j ACCEPT  \nPostUp = iptables -t nat -A POSTROUTING -s 10.0.100.0/24 ! -d 10.0.100.0/24 -j MASQUERADE\nPostUp = iptables -A INPUT -p udp --dport 51820 -j ACCEPT\n\nPostDown = iptables -D FORWARD -i wg0 -j ACCEPT\nPostDown = iptables -D FORWARD -o wg0 -j ACCEPT\nPostDown = iptables -t nat -D POSTROUTING -s 10.0.100.0/24 ! -d 10.0.100.0/24 -j MASQUERADE\nPostDown = iptables -D INPUT -p udp --dport 51820 -j ACCEPT\n\n[Peer]\nPublicKey = __ANYA-LAPTOP_PUBLIC_KEY__\nAllowedIPs = 10.0.100.12/32\n\n\n[Peer]\nPublicKey = __ANYA-PHONE_PUBLIC_KEY__\nAllowedIPs = 10.0.100.11/32\n\n\n[Peer]\nPublicKey = __EGOR-MAIN_PUBLIC_KEY__\nAllowedIPs = 10.0.100.2/32\n\n\n[Peer]\nPublicKey = __FRIEND-TEST_PUBLIC_KEY__\nAllowedIPs = 10.0.100.20/32\n\n"
kind: ConfigMap
metadata:
  name: wireguard-config
  namespace: wireguard-system
