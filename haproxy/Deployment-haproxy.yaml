apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: nginx-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      annotations:
        checksum/config: 70930c2b5205e964d157aa3ff9f20facc4a89c816d2eacbe7c6d8ea39864d398
      labels:
        app: haproxy
    spec:
      containers:
        - image: docker.io/library/haproxy:3.0-alpine@sha256:1c15903c50d5510dcc01de755049e7015a6dd3f35bb2dc4582e888116cb71d8f
          name: haproxy
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
            - containerPort: 22
              name: tcp-22
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - mountPath: /usr/local/etc/haproxy
              name: config
              readOnly: true
      volumes:
        - configMap:
            name: haproxy-config
          name: config
