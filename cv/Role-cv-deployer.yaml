apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cv-deployer
  namespace: cv
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resourceNames:
      - cv
      - cv-tui
    resources:
      - deployments
    verbs:
      - patch
