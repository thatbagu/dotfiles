apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: cv
  name: cv
  namespace: cv
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cv
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cv
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - worker
              weight: 100
      containers:
        - env: []
          image: docker.io/thatbagu/website:latest
          name: cv
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            periodSeconds: 10
            tcpSocket:
              port: 80
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts: []
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes: []
